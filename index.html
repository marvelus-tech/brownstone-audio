<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brownstone Audio (Bleeding Edge)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Design Tokens */
    :root {
      /* Colors: Editorial Salon */
      --field: #F9F6F1;
      --paper: #FFFDFB;
      --ink: #121212;
      --ink-secondary: #4A4A4A;
      --ink-tertiary: #878787;
      --border-soft: #E8E3DC;
      --border: #D4CFC6;
      --accent: #C96850;
      --accent-hover: #B35840;
      --accent-light: #FDF5F3;
      --shadow-card: 0 1px 3px rgba(18, 18, 18, 0.06);
      --shadow-hover: 0 8px 24px rgba(18, 18, 18, 0.12);
      --shadow-press: 0 2px 8px rgba(18, 18, 18, 0.1);
      
      /* Typography: Fraunces (display) + DM Sans (body) */
      --font-display: 'Fraunces', Georgia, serif;
      --font-body: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      
      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --duration-fast: 140ms;
      --duration-base: 200ms;
      --duration-slow: 280ms;
    }
    
    * { 
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-body);
      background: var(--field);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }
    
    /* Subtle paper texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(201, 104, 80, 0.03) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(201, 104, 80, 0.02) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 120px;
      position: relative;
      z-index: 1;
    }
    
    /* Hero: Thesis Statement */
    .hero {
      padding: 64px 0 48px;
      max-width: 720px;
    }
    
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 16px;
      font-variation-settings: 'opsz' 144;
    }
    
    .hero-promise {
      font-size: clamp(1.125rem, 2vw, 1.375rem);
      color: var(--ink-secondary);
      margin-bottom: 12px;
      font-weight: 400;
      line-height: 1.5;
    }
    
    .hero-count {
      font-size: 0.9375rem;
      color: var(--ink-tertiary);
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    
    /* Search */
    .search-wrap {
      margin-bottom: 40px;
      max-width: 480px;
    }
    
    .search-input {
      width: 100%;
      padding: 14px 18px;
      font-family: var(--font-body);
      font-size: 1rem;
      border: 1.5px solid var(--border-soft);
      border-radius: 10px;
      background: var(--paper);
      color: var(--ink);
      transition: border-color var(--duration-fast) var(--ease-out), 
                  box-shadow var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-light);
    }
    
    .search-input:active {
      transform: scale(0.995);
    }
    
    .search-input::placeholder {
      color: var(--ink-tertiary);
    }
    
    /* Article Grid */
    .list {
      display: grid;
      gap: 20px;
    }
    
    .card {
      background: var(--paper);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 28px;
      display: grid;
      gap: 20px;
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
      opacity: 0;
      animation: cardMount var(--duration-slow) var(--ease-out) forwards;
    }
    
    @keyframes cardMount {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Stagger cards */
    .card:nth-child(1) { animation-delay: 30ms; }
    .card:nth-child(2) { animation-delay: 60ms; }
    .card:nth-child(3) { animation-delay: 90ms; }
    .card:nth-child(4) { animation-delay: 120ms; }
    .card:nth-child(5) { animation-delay: 150ms; }
    .card:nth-child(6) { animation-delay: 180ms; }
    .card:nth-child(n+7) { animation-delay: 210ms; }
    
    @media (hover: hover) {
      .card:hover {
        box-shadow: var(--shadow-hover);
        transform: translateY(-3px);
      }
    }
    
    .card[hidden] {
      display: none;
    }
    
    /* Card flowing on search filter */
    .card.filtering {
      animation: none;
      transition: opacity var(--duration-base) var(--ease-out);
    }
    
    .meta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .meta h2 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 2.5vw, 1.875rem);
      font-weight: 600;
      line-height: 1.25;
      color: var(--ink);
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      font-variation-settings: 'opsz' 72;
    }
    
    .date {
      color: var(--ink-tertiary);
      font-size: 0.9375rem;
      font-weight: 500;
    }
    
    .player-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    audio {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      box-shadow: var(--shadow-card);
    }
    
    audio:focus {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    
    .duration-hint {
      color: var(--ink-tertiary);
      font-size: 0.875rem;
      font-weight: 500;
    }
    
    /* Badge with spring entrance */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: var(--accent-light);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      font-size: 0.9375rem;
      color: var(--accent-hover);
      font-weight: 500;
      margin-top: 8px;
      opacity: 0;
      animation: badgeMount var(--duration-base) var(--ease-spring) forwards;
    }
    
    @keyframes badgeMount {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(-4px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    .keep-btn {
      padding: 10px 20px;
      min-height: 44px;
      min-width: 88px;
      background: var(--accent);
      color: var(--paper);
      border: none;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out),
                  box-shadow var(--duration-fast) var(--ease-out);
      box-shadow: var(--shadow-card);
      touch-action: manipulation;
    }
    
    @media (hover: hover) {
      .keep-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
        box-shadow: var(--shadow-press);
      }
    }
    
    .keep-btn:active {
      transform: scale(0.98);
    }
    
    .keep-btn:focus {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }
    
    .source-link {
      color: var(--ink-tertiary);
      text-decoration: none;
      font-size: 0.9375rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      transition: color var(--duration-fast) var(--ease-out);
      position: relative;
    }
    
    .source-link::after {
      content: '↗';
      opacity: 0.6;
      transition: opacity var(--duration-fast) var(--ease-out),
                  transform var(--duration-fast) var(--ease-out);
    }
    
    @media (hover: hover) {
      .source-link:hover {
        color: var(--accent);
      }
      .source-link:hover::after {
        opacity: 1;
        transform: translate(2px, -2px);
      }
    }
    
    .source-link:focus {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 6px;
    }
    
    /* Now Playing Bar (Apple continuity) */
    .now-playing {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--paper);
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      box-shadow: 0 -4px 24px rgba(18, 18, 18, 0.08);
      transform: translateY(100%);
      transition: transform var(--duration-base) var(--ease-out);
      z-index: 100;
      opacity: 0;
    }
    
    .now-playing.active {
      transform: translateY(0);
      opacity: 1;
      animation: nowPlayingSlide var(--duration-base) var(--ease-out) forwards;
    }
    
    @keyframes nowPlayingSlide {
      from {
        transform: translateY(100%);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .now-playing-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .now-playing-title {
      flex: 1;
      font-family: var(--font-display);
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variation-settings: 'opsz' 48;
    }
    
    .now-playing-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--accent-light);
      border-radius: 6px;
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
    }
    
    .now-playing-pulse {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }
    
    /* Footer */
    footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid var(--border-soft);
      color: var(--ink-tertiary);
      font-size: 0.9375rem;
      text-align: center;
    }
    
    /* States */
    .empty-state,
    .loading {
      padding: 80px 32px;
      text-align: center;
    }
    
    .empty-state-icon {
      font-size: 3.5rem;
      margin-bottom: 20px;
      opacity: 0.2;
    }
    
    .empty-state p,
    .loading p {
      color: var(--ink-secondary);
      font-size: 1.125rem;
    }
    
    /* Loading skeleton */
    .skeleton {
      display: grid;
      gap: 20px;
    }
    
    .skeleton-card {
      background: var(--paper);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 28px;
      height: 180px;
      position: relative;
      overflow: hidden;
    }
    
    .skeleton-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(201, 104, 80, 0.04) 50%,
        transparent 100%
      );
      animation: shimmer 2s infinite;
    }
    
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    
    /* Responsive */
    @media (min-width: 768px) {
      .wrap {
        padding-left: 32px;
        padding-right: 32px;
      }
      
      .hero {
        padding: 80px 0 56px;
      }
      
      .card {
        grid-template-columns: 1fr minmax(320px, 400px);
        align-items: start;
        padding: 32px;
        gap: 32px;
      }
      
      .now-playing-inner {
        padding: 0 12px;
      }
    }
    
    @media (min-width: 1024px) {
      .card {
        padding: 36px;
      }
    }
    
    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      
      .card {
        opacity: 1;
        transform: none;
      }
      
      .badge {
        opacity: 1;
        transform: none;
      }
      
      .now-playing.active {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>Brownstone Audio</h1>
      <p class="hero-promise">Listen to bleeding edge technology analysis, narrated daily.</p>
      <p class="hero-count" id="heroCount">Loading archive...</p>
    </header>
    
    <div class="search-wrap">
      <input 
        type="search" 
        class="search-input" 
        id="searchInput" 
        placeholder="Search by title..."
        aria-label="Search articles"
      />
    </div>
    
    <section class="list" id="articleList" role="feed" aria-busy="true">
      <div class="loading">
        <div class="skeleton">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
    </section>
    
    <footer>Auto-generated from the Brownstone monitor workflow.</footer>
  </div>
  
  <!-- Now Playing Bar -->
  <div class="now-playing" id="nowPlaying" role="complementary" aria-label="Now playing">
    <div class="now-playing-inner">
      <div class="now-playing-badge">
        <div class="now-playing-pulse"></div>
        <span>Playing</span>
      </div>
      <div class="now-playing-title" id="nowPlayingTitle"></div>
    </div>
  </div>

  <script>
    (async () => {
      // Handle authentication token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const tokenFromUrl = urlParams.get('key') || hashParams.get('key');
      
      if (tokenFromUrl) {
        localStorage.setItem('listenToken', tokenFromUrl);
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      const token = localStorage.getItem('listenToken');
      const heardLocal = JSON.parse(localStorage.getItem('heardLocal') || '{}');

      // Fetch data
      const [articlesRes, listensRes] = await Promise.all([
        fetch('articles.json'),
        fetch('listens.json').catch(() => ({ json: async () => ({}) }))
      ]);
      
      const articles = await articlesRes.json();
      const listens = await listensRes.json();
      
      const now = Date.now();
      const listEl = document.getElementById('articleList');
      const searchInput = document.getElementById('searchInput');
      const heroCount = document.getElementById('heroCount');
      const nowPlaying = document.getElementById('nowPlaying');
      const nowPlayingTitle = document.getElementById('nowPlayingTitle');
      
      // Update hero count
      const validArticles = articles.filter(article => {
        const listen = listens[article.slug];
        const deleteAfter = listen?.delete_after;
        return !deleteAfter || new Date(deleteAfter) >= now;
      });
      
      heroCount.textContent = `${validArticles.length} narration${validArticles.length !== 1 ? 's' : ''} available`;
      
      // Clear loading state
      listEl.innerHTML = '';
      listEl.setAttribute('aria-busy', 'false');
      
      if (validArticles.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div class="empty-state-icon">♫</div><p>No articles available yet.</p>';
        listEl.appendChild(empty);
        return;
      }
      
      // Track currently playing audio
      let currentAudio = null;
      
      // Render cards
      for (const article of validArticles) {
        const listen = listens[article.slug];
        const heardAt = listen?.heard_at || heardLocal[article.slug];
        const deleteAfter = listen?.delete_after;
        
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.slug = article.slug;
        card.dataset.title = article.title.toLowerCase();
        
        const meta = document.createElement('div');
        meta.className = 'meta';
        
        const title = document.createElement('h2');
        title.textContent = article.title;
        
        const date = document.createElement('p');
        date.className = 'date';
        date.textContent = article.date;
        
        meta.appendChild(title);
        meta.appendChild(date);
        
        // Add badge if heard
        if (heardAt) {
          const badge = document.createElement('div');
          badge.className = 'badge';
          badge.setAttribute('role', 'status');
          badge.setAttribute('aria-live', 'polite');
          
          const badgeText = document.createElement('span');
          badgeText.textContent = 'Heard · deletes in 3 days';
          
          const keepBtn = document.createElement('button');
          keepBtn.className = 'keep-btn';
          keepBtn.textContent = 'Keep';
          keepBtn.setAttribute('aria-label', `Keep ${article.title}`);
          
          keepBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            // Remove from localStorage
            delete heardLocal[article.slug];
            localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
            
            // Call GitHub API if authenticated
            if (token) {
              try {
                await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    event_type: 'listen_keep',
                    client_payload: { slug: article.slug }
                  })
                });
              } catch (err) {
                console.error('Keep API error:', err);
              }
            }
            
            // Remove badge with fade
            badge.style.transition = 'opacity 200ms ease-out, transform 200ms ease-out';
            badge.style.opacity = '0';
            badge.style.transform = 'scale(0.95)';
            setTimeout(() => badge.remove(), 200);
          });
          
          badge.appendChild(badgeText);
          badge.appendChild(keepBtn);
          meta.appendChild(badge);
        }
        
        const link = document.createElement('a');
        link.className = 'source-link';
        link.href = article.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Source';
        link.setAttribute('aria-label', `Read source article: ${article.title}`);
        
        meta.appendChild(link);
        
        const playerWrap = document.createElement('div');
        playerWrap.className = 'player-wrap';
        
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = article.audio;
        audio.setAttribute('aria-label', `Audio narration of ${article.title}`);
        
        const durationHint = document.createElement('div');
        durationHint.className = 'duration-hint';
        durationHint.textContent = 'Loading...';
        
        // Update duration hint when metadata loads
        audio.addEventListener('loadedmetadata', () => {
          const duration = Math.floor(audio.duration);
          const minutes = Math.floor(duration / 60);
          const seconds = duration % 60;
          durationHint.textContent = `Duration: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        });
        
        audio.addEventListener('error', () => {
          durationHint.textContent = 'Audio unavailable';
        });
        
        // Now Playing Bar interaction
        audio.addEventListener('play', () => {
          if (currentAudio && currentAudio !== audio) {
            currentAudio.pause();
          }
          currentAudio = audio;
          nowPlayingTitle.textContent = article.title;
          nowPlaying.classList.add('active');
        });
        
        audio.addEventListener('pause', () => {
          if (currentAudio === audio && audio.ended) {
            nowPlaying.classList.remove('active');
          }
        });
        
        audio.addEventListener('ended', () => {
          nowPlaying.classList.remove('active');
        });
        
        // Track completion
        let completed = false;
        const markComplete = async () => {
          if (completed) return;
          completed = true;
          
          // Store in localStorage
          heardLocal[article.slug] = new Date().toISOString();
          localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
          
          // Add badge immediately
          const existingBadge = meta.querySelector('.badge');
          if (existingBadge) return;
          
          const badge = document.createElement('div');
          badge.className = 'badge';
          badge.setAttribute('role', 'status');
          badge.setAttribute('aria-live', 'polite');
          
          const badgeText = document.createElement('span');
          badgeText.textContent = 'Heard · deletes in 3 days';
          
          const keepBtn = document.createElement('button');
          keepBtn.className = 'keep-btn';
          keepBtn.textContent = 'Keep';
          keepBtn.setAttribute('aria-label', `Keep ${article.title}`);
          
          keepBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            delete heardLocal[article.slug];
            localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
            
            if (token) {
              try {
                await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    event_type: 'listen_keep',
                    client_payload: { slug: article.slug }
                  })
                });
              } catch (err) {
                console.error('Keep API error:', err);
              }
            }
            
            badge.style.transition = 'opacity 200ms ease-out, transform 200ms ease-out';
            badge.style.opacity = '0';
            badge.style.transform = 'scale(0.95)';
            setTimeout(() => badge.remove(), 200);
          });
          
          badge.appendChild(badgeText);
          badge.appendChild(keepBtn);
          
          // Insert before source link
          meta.insertBefore(badge, link);
          
          // Call GitHub API if authenticated
          if (token) {
            try {
              await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  event_type: 'listen_complete',
                  client_payload: { 
                    slug: article.slug,
                    audio: article.audio 
                  }
                })
              });
            } catch (err) {
              console.error('Complete API error:', err);
            }
          }
        };
        
        // Ended event
        audio.addEventListener('ended', markComplete);
        
        // 98% fallback on timeupdate
        audio.addEventListener('timeupdate', () => {
          if (audio.duration && audio.currentTime / audio.duration >= 0.98) {
            markComplete();
          }
        });
        
        playerWrap.appendChild(audio);
        playerWrap.appendChild(durationHint);
        
        card.appendChild(meta);
        card.appendChild(playerWrap);
        listEl.appendChild(card);
      }
      
      // Search filter with opacity crossfade
      let filterTimeout;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(filterTimeout);
        
        const query = e.target.value.toLowerCase().trim();
        const cards = listEl.querySelectorAll('.card');
        
        // Add filtering class for smooth transitions
        cards.forEach(card => card.classList.add('filtering'));
        
        filterTimeout = setTimeout(() => {
          let visibleCount = 0;
          cards.forEach(card => {
            const title = card.dataset.title || '';
            const matches = !query || title.includes(query);
            card.hidden = !matches;
            if (matches) visibleCount++;
          });
          
          // Show/hide empty state
          let emptyState = listEl.querySelector('.empty-state');
          if (visibleCount === 0 && query) {
            if (!emptyState) {
              emptyState = document.createElement('div');
              emptyState.className = 'empty-state';
              emptyState.innerHTML = '<div class="empty-state-icon">🔍</div><p>No articles match your search.</p>';
              listEl.appendChild(emptyState);
            }
            emptyState.hidden = false;
          } else if (emptyState) {
            emptyState.hidden = true;
          }
        }, 100);
      });
    })();
  </script>
</body>
</html>
