<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brownstone Audio — Bleeding Edge</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #111827;
      --border: #1f2a44;
      --text: #e6edf7;
      --muted: #94a3b8;
      --accent: #14f195;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 600px at 80% -20%, #1f2952 0%, transparent 60%), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 24px 16px 56px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 2.4vw, 2rem); }
    .sub { color: var(--muted); margin-bottom: 20px; }
    .list { display: grid; gap: 12px; }
    .card {
      background: linear-gradient(180deg, rgba(17,24,39,0.92), rgba(13,18,32,0.92));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }
    .meta h2 { margin: 0 0 4px; font-size: 1rem; line-height: 1.35; }
    .meta p { margin: 0; color: var(--muted); font-size: .92rem; }
    .src { color: var(--accent); text-decoration: none; font-size: .88rem; display: inline-block; margin-top: 6px; }
    .badge { 
      background: rgba(20, 241, 149, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: .82rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .keep-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .keep-btn:hover { opacity: 0.85; }
    audio { width: 100%; }
    footer { margin-top: 18px; color: var(--muted); font-size: .84rem; }
    @media (min-width: 700px) {
      .card { grid-template-columns: 1fr minmax(260px, 340px); align-items: center; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Brownstone Audio — Bleeding Edge</h1>
    <p class="sub">Latest article narrations, newest first.</p>
    <section class="list" id="articleList"></section>
    <footer>Auto-generated from the Brownstone monitor workflow.</footer>
  </main>

  <script>
    (async () => {
      // Handle authentication token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const tokenFromUrl = urlParams.get('key') || hashParams.get('key');
      
      if (tokenFromUrl) {
        localStorage.setItem('listenToken', tokenFromUrl);
        // Clean URL without reload
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      const token = localStorage.getItem('listenToken');
      const heardLocal = JSON.parse(localStorage.getItem('heardLocal') || '{}');

      // Fetch data
      const [articlesRes, listensRes] = await Promise.all([
        fetch('articles.json'),
        fetch('listens.json').catch(() => ({ json: async () => ({}) }))
      ]);
      
      const articles = await articlesRes.json();
      const listens = await listensRes.json();
      
      const now = Date.now();
      const listEl = document.getElementById('articleList');
      
      // Render cards
      for (const article of articles) {
        const listen = listens[article.slug];
        const heardAt = listen?.heard_at || heardLocal[article.slug];
        const deleteAfter = listen?.delete_after;
        
        // Skip cards that should already be deleted
        if (deleteAfter && new Date(deleteAfter) < now) continue;
        
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.slug = article.slug;
        
        const meta = document.createElement('div');
        meta.className = 'meta';
        
        const title = document.createElement('h2');
        title.textContent = article.title;
        
        const date = document.createElement('p');
        date.textContent = article.date;
        
        const link = document.createElement('a');
        link.className = 'src';
        link.href = article.url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'Source ↗';
        
        meta.appendChild(title);
        meta.appendChild(date);
        
        // Add badge if heard
        if (heardAt) {
          const badge = document.createElement('div');
          badge.className = 'badge';
          badge.innerHTML = 'Heard · deletes in 3 days <button class="keep-btn">Keep</button>';
          
          const keepBtn = badge.querySelector('.keep-btn');
          keepBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            // Remove from localStorage
            delete heardLocal[article.slug];
            localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
            
            // Call GitHub API if authenticated
            if (token) {
              try {
                await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    event_type: 'listen_keep',
                    client_payload: { slug: article.slug }
                  })
                });
              } catch (err) {
                // Fail silently
                console.error('Keep API error:', err);
              }
            }
            
            // Remove badge
            badge.remove();
          });
          
          meta.appendChild(badge);
        }
        
        meta.appendChild(link);
        
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'none';
        audio.src = article.audio;
        
        // Track completion
        let completed = false;
        const markComplete = async () => {
          if (completed) return;
          completed = true;
          
          // Store in localStorage
          heardLocal[article.slug] = new Date().toISOString();
          localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
          
          // Add badge immediately
          const badge = document.createElement('div');
          badge.className = 'badge';
          badge.innerHTML = 'Heard · deletes in 3 days <button class="keep-btn">Keep</button>';
          
          const keepBtn = badge.querySelector('.keep-btn');
          keepBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            delete heardLocal[article.slug];
            localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
            
            if (token) {
              try {
                await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    event_type: 'listen_keep',
                    client_payload: { slug: article.slug }
                  })
                });
              } catch (err) {
                console.error('Keep API error:', err);
              }
            }
            
            badge.remove();
          });
          
          // Find where to insert (after date, before link)
          const existingBadge = meta.querySelector('.badge');
          if (!existingBadge) {
            meta.insertBefore(badge, link);
          }
          
          // Call GitHub API if authenticated
          if (token) {
            try {
              await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  event_type: 'listen_complete',
                  client_payload: { 
                    slug: article.slug,
                    audio: article.audio 
                  }
                })
              });
            } catch (err) {
              console.error('Complete API error:', err);
            }
          }
        };
        
        // Ended event
        audio.addEventListener('ended', markComplete);
        
        // 98% fallback on timeupdate
        audio.addEventListener('timeupdate', () => {
          if (audio.duration && audio.currentTime / audio.duration >= 0.98) {
            markComplete();
          }
        });
        
        card.appendChild(meta);
        card.appendChild(audio);
        listEl.appendChild(card);
      }
    })();
  </script>
</body>
</html>
