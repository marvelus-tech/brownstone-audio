<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brownstone Audio (Bleeding Edge)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #FAF8F5;
      --ink: #1a1a1a;
      --ink-muted: #5a5a5a;
      --border: #e0dcd5;
      --card: #ffffff;
      --accent: #7a9b8e;
      --accent-hover: #698a7d;
      --accent-light: #f0f4f2;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.08);
      --font-display: 'Crimson Pro', Georgia, serif;
      --font-body: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }
    
    header {
      margin-bottom: 32px;
    }
    
    h1 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    
    .subtitle {
      color: var(--ink-muted);
      margin: 0 0 24px;
      font-size: 1rem;
    }
    
    .search-wrap {
      margin-bottom: 24px;
    }
    
    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      font-family: var(--font-body);
      font-size: 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    
    .search-input::placeholder {
      color: var(--ink-muted);
    }
    
    .list {
      display: grid;
      gap: 16px;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: grid;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 150ms var(--ease), transform 150ms var(--ease);
    }
    
    @media (hover: hover) {
      .card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }
    }
    
    .card[hidden] {
      display: none;
    }
    
    .meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .meta h2 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.375rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    
    .date {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }
    
    .player-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    audio {
      width: 100%;
      height: 40px;
      border-radius: 6px;
    }
    
    audio:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    .duration-hint {
      color: var(--ink-muted);
      font-size: 0.85rem;
      font-style: italic;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--accent-light);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      color: var(--accent-hover);
      margin-top: 4px;
    }
    
    .keep-btn {
      padding: 8px 16px;
      min-height: 44px;
      min-width: 80px;
      background: var(--accent);
      color: var(--card);
      border: none;
      border-radius: 6px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms var(--ease), transform 120ms var(--ease);
      touch-action: manipulation;
    }
    
    @media (hover: hover) {
      .keep-btn:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }
    }
    
    .keep-btn:active {
      transform: translateY(0);
    }
    
    .keep-btn:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    
    .source-link {
      color: var(--ink-muted);
      text-decoration: none;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      transition: color 150ms var(--ease);
    }
    
    @media (hover: hover) {
      .source-link:hover {
        color: var(--accent-hover);
      }
    }
    
    .source-link:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }
    
    footer {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--ink-muted);
      font-size: 0.875rem;
      text-align: center;
    }
    
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--ink-muted);
    }
    
    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    .loading {
      padding: 48px 24px;
      text-align: center;
      color: var(--ink-muted);
    }
    
    @media (min-width: 768px) {
      .wrap {
        padding: 48px 24px 96px;
      }
      
      header {
        margin-bottom: 40px;
      }
      
      .card {
        grid-template-columns: 1fr minmax(300px, 360px);
        align-items: start;
        padding: 24px;
        gap: 24px;
      }
      
      .meta h2 {
        font-size: 1.5rem;
      }
    }
    
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Brownstone Audio (Bleeding Edge)</h1>
      <p class="subtitle">Latest article narrations, newest first.</p>
      <div class="search-wrap">
        <input 
          type="search" 
          class="search-input" 
          id="searchInput" 
          placeholder="Filter by title..."
          aria-label="Search articles"
        />
      </div>
    </header>
    
    <section class="list" id="articleList" role="feed" aria-busy="true">
      <div class="loading">Loading articles...</div>
    </section>
    
    <footer>Auto-generated from the Brownstone monitor workflow.</footer>
  </main>

  <script>
    (async () => {
      // Handle authentication token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const tokenFromUrl = urlParams.get('key') || hashParams.get('key');
      
      if (tokenFromUrl) {
        localStorage.setItem('listenToken', tokenFromUrl);
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }

      const token = localStorage.getItem('listenToken');
      const heardLocal = JSON.parse(localStorage.getItem('heardLocal') || '{}');

      // Fetch data
      const [articlesRes, listensRes] = await Promise.all([
        fetch('articles.json'),
        fetch('listens.json').catch(() => ({ json: async () => ({}) }))
      ]);
      
      const articles = await articlesRes.json();
      const listens = await listensRes.json();
      
      const now = Date.now();
      const listEl = document.getElementById('articleList');
      const searchInput = document.getElementById('searchInput');
      
      // Clear loading state
      listEl.innerHTML = '';
      listEl.setAttribute('aria-busy', 'false');
      
      if (articles.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = '<div class="empty-state-icon">♫</div><p>No articles available yet.</p>';
        listEl.appendChild(empty);
        return;
      }
      
      // Render cards
      for (const article of articles) {
        const listen = listens[article.slug];
        const heardAt = listen?.heard_at || heardLocal[article.slug];
        const deleteAfter = listen?.delete_after;
        
        // Skip cards that should already be deleted
        if (deleteAfter && new Date(deleteAfter) < now) continue;
        
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.slug = article.slug;
        card.dataset.title = article.title.toLowerCase();
        
        const meta = document.createElement('div');
        meta.className = 'meta';
        
        const title = document.createElement('h2');
        title.textContent = article.title;
        
        const date = document.createElement('p');
        date.className = 'date';
        date.textContent = article.date;
        
        meta.appendChild(title);
        meta.appendChild(date);
        
        // Add badge if heard
        if (heardAt) {
          const badge = document.createElement('div');
          badge.className = 'badge';
          badge.setAttribute('role', 'status');
          badge.setAttribute('aria-live', 'polite');
          
          const badgeText = document.createElement('span');
          badgeText.textContent = 'Heard · deletes in 3 days';
          
          const keepBtn = document.createElement('button');
          keepBtn.className = 'keep-btn';
          keepBtn.textContent = 'Keep';
          keepBtn.setAttribute('aria-label', `Keep ${article.title}`);
          
          keepBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            // Remove from localStorage
            delete heardLocal[article.slug];
            localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
            
            // Call GitHub API if authenticated
            if (token) {
              try {
                await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    event_type: 'listen_keep',
                    client_payload: { slug: article.slug }
                  })
                });
              } catch (err) {
                console.error('Keep API error:', err);
              }
            }
            
            // Remove badge
            badge.remove();
          });
          
          badge.appendChild(badgeText);
          badge.appendChild(keepBtn);
          meta.appendChild(badge);
        }
        
        const link = document.createElement('a');
        link.className = 'source-link';
        link.href = article.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.innerHTML = 'Source <span aria-hidden="true">↗</span>';
        link.setAttribute('aria-label', `Read source article: ${article.title}`);
        
        meta.appendChild(link);
        
        const playerWrap = document.createElement('div');
        playerWrap.className = 'player-wrap';
        
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.preload = 'metadata';
        audio.src = article.audio;
        audio.setAttribute('aria-label', `Audio narration of ${article.title}`);
        
        const durationHint = document.createElement('div');
        durationHint.className = 'duration-hint';
        durationHint.textContent = 'Loading...';
        
        // Update duration hint when metadata loads
        audio.addEventListener('loadedmetadata', () => {
          const duration = Math.floor(audio.duration);
          const minutes = Math.floor(duration / 60);
          const seconds = duration % 60;
          durationHint.textContent = `Duration: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        });
        
        audio.addEventListener('error', () => {
          durationHint.textContent = 'Audio unavailable';
        });
        
        // Track completion
        let completed = false;
        const markComplete = async () => {
          if (completed) return;
          completed = true;
          
          // Store in localStorage
          heardLocal[article.slug] = new Date().toISOString();
          localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
          
          // Add badge immediately
          const existingBadge = meta.querySelector('.badge');
          if (existingBadge) return; // Already has badge
          
          const badge = document.createElement('div');
          badge.className = 'badge';
          badge.setAttribute('role', 'status');
          badge.setAttribute('aria-live', 'polite');
          
          const badgeText = document.createElement('span');
          badgeText.textContent = 'Heard · deletes in 3 days';
          
          const keepBtn = document.createElement('button');
          keepBtn.className = 'keep-btn';
          keepBtn.textContent = 'Keep';
          keepBtn.setAttribute('aria-label', `Keep ${article.title}`);
          
          keepBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            delete heardLocal[article.slug];
            localStorage.setItem('heardLocal', JSON.stringify(heardLocal));
            
            if (token) {
              try {
                await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json',
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    event_type: 'listen_keep',
                    client_payload: { slug: article.slug }
                  })
                });
              } catch (err) {
                console.error('Keep API error:', err);
              }
            }
            
            badge.remove();
          });
          
          badge.appendChild(badgeText);
          badge.appendChild(keepBtn);
          
          // Insert before source link
          meta.insertBefore(badge, link);
          
          // Call GitHub API if authenticated
          if (token) {
            try {
              await fetch('https://api.github.com/repos/marvelus-tech/brownstone-audio/dispatches', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  event_type: 'listen_complete',
                  client_payload: { 
                    slug: article.slug,
                    audio: article.audio 
                  }
                })
              });
            } catch (err) {
              console.error('Complete API error:', err);
            }
          }
        };
        
        // Ended event
        audio.addEventListener('ended', markComplete);
        
        // 98% fallback on timeupdate
        audio.addEventListener('timeupdate', () => {
          if (audio.duration && audio.currentTime / audio.duration >= 0.98) {
            markComplete();
          }
        });
        
        playerWrap.appendChild(audio);
        playerWrap.appendChild(durationHint);
        
        card.appendChild(meta);
        card.appendChild(playerWrap);
        listEl.appendChild(card);
      }
      
      // Search filter
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const cards = listEl.querySelectorAll('.card');
        
        let visibleCount = 0;
        cards.forEach(card => {
          const title = card.dataset.title || '';
          const matches = !query || title.includes(query);
          card.hidden = !matches;
          if (matches) visibleCount++;
        });
        
        // Show/hide empty state
        let emptyState = listEl.querySelector('.empty-state');
        if (visibleCount === 0 && query) {
          if (!emptyState) {
            emptyState = document.createElement('div');
            emptyState.className = 'empty-state';
            emptyState.innerHTML = '<div class="empty-state-icon">🔍</div><p>No articles match your search.</p>';
            listEl.appendChild(emptyState);
          }
          emptyState.hidden = false;
        } else if (emptyState) {
          emptyState.hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
